name: Close ticket

# Closes the ticket when its branch is merged into dev. GitHub's own "Closes #1" only works for
# merges into the default branch (main). The branch itself is deleted by the repo setting.
on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  issues: write

jobs:
  close:
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      # The branch name is user input, so it reaches the script as a variable, never as script text.
      - env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # The branch is named after its issue: "TMP-030-Close-ticket..." (older ones "technical/TMP-028-...").
          key=$(grep -oE '[A-Z]{3}-[0-9]{3}' <<<"$BRANCH" | head -1 || true)
          if [ -z "$key" ]; then
            echo "No ticket key in branch '$BRANCH'."; exit 0
          fi
          issue=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --limit 1000 --json number,title \
            -q '.[] | "\(.number) \(.title)"' | grep -E "^[0-9]+ $key-" | cut -d' ' -f1 | head -1 || true)
          if [ -z "$issue" ]; then
            echo "No open issue for $key."; exit 0
          fi
          gh issue close "$issue" -R "$GITHUB_REPOSITORY" --comment "Merged into dev in #$PR."
