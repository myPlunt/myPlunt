name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

env:
  # GHCR needs a lowercase path.
  REGISTRY_IMAGE: ghcr.io/myplunt/myplunt
  # dev deploys to staging, main to production.
  IMAGE_TAG: ${{ github.ref_name == 'main' && 'latest' || 'staging' }}

jobs:
  # Each app's jobs run only when files under its directory change.
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      landing: ${{ steps.filter.outputs.landing }}
      admin: ${{ steps.filter.outputs.admin }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend: frontend/**
            backend: backend/**
            landing: web_landing/**
            admin: admin_dashboard/**

  # TEST
  test-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:ci
      - run: npm run lint
      - run: npx tsc --noEmit
      # Fails only on critical advisories.
      - run: npm audit --audit-level=critical

  # The runner has Docker, so Testcontainers (ApplicationTests) works without extra setup.
  test-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: ./mvnw -B test

  check-landing:
    needs: changes
    if: needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web_landing/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  check-admin:
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin_dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin_dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # BUILD + DEPLOY (pushes to dev/main only)
  deploy-backend:
    needs: test-backend
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.REGISTRY_IMAGE }}/backend:${{ env.IMAGE_TAG }}
      - name: Deploy via Coolify
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          WEBHOOK_URL: ${{ github.ref_name == 'main' && secrets.COOLIFY_BACKEND_PROD_WEBHOOK_URL || secrets.COOLIFY_BACKEND_STAGING_WEBHOOK_URL }}
        run: 'curl -fsS -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" "$WEBHOOK_URL"'

  deploy-admin:
    needs: check-admin
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The API URL is baked into the bundle at build time.
      - uses: docker/build-push-action@v6
        with:
          context: admin_dashboard
          push: true
          tags: ${{ env.REGISTRY_IMAGE }}/admin-dashboard:${{ env.IMAGE_TAG }}
          build-args: |
            VITE_API_URL=${{ github.ref_name == 'main' && vars.PROD_BACKEND_URL || vars.STAGING_BACKEND_URL }}
            ${{ github.ref_name != 'main' && 'VITE_APP_VARIANT=staging' || '' }}
      - name: Deploy via Coolify
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          WEBHOOK_URL: ${{ github.ref_name == 'main' && secrets.COOLIFY_ADMIN_PROD_WEBHOOK_URL || secrets.COOLIFY_ADMIN_STAGING_WEBHOOK_URL }}
        run: 'curl -fsS -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" "$WEBHOOK_URL"'

  # The landing page only ships to production.
  deploy-landing:
    needs: check-landing
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: web_landing
          push: true
          tags: ${{ env.REGISTRY_IMAGE }}/web-landing:latest
      - name: Deploy via Coolify
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          WEBHOOK_URL: ${{ secrets.COOLIFY_LANDING_WEBHOOK_URL }}
        run: 'curl -fsS -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" "$WEBHOOK_URL"'
