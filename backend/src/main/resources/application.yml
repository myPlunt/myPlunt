spring:
  application:
    name: backend
  # We authenticate with JWT only; without this Spring creates a default user and
  # logs its generated password on every start.
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  mvc:
    # Devtools turns this on, and its log line includes rejected request values such as
    # passwords. GlobalExceptionHandler already logs failures without the values.
    log-resolved-exception: false
  jpa:
    # Set explicitly (same as the default) to silence its startup warning in the log file.
    open-in-view: true
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    # Lets the db/seed SQL give its storage keys the same prefix real uploads get.
    placeholders:
      storagePrefix: ${app.storage.prefix}

app:
  # Filled in by Maven at build time; every backend log line carries it as backend_version.
  version: '@project.version@'
  # backend.log, audit.log and frontend.log (see logback-spring.xml). Retention is in days.
  logging:
    dir: ${LOG_DIR:logs}
    retention-days:
      backend: 14
      audit: 365
      frontend: 14
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 30
  storage:
    endpoint: ${STORAGE_ENDPOINT}
    bucket: ${STORAGE_BUCKET}
    access-key: ${STORAGE_ACCESS_KEY}
    secret-key: ${STORAGE_SECRET_KEY}
    prefix: ${STORAGE_PREFIX:}
    upload-url-ttl-minutes: 5
    read-url-ttl-minutes: 15
    max-upload-size-bytes: 5242880 # 5MB