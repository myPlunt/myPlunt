spring:
  application:
    name: backend
  # We authenticate with JWT only; without this Spring creates a default user and
  # logs its generated password on every start.
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  mvc:
    # Devtools turns this on, and its log line includes rejected request values such as
    # passwords. GlobalExceptionHandler already logs failures without the values.
    log-resolved-exception: false
  jpa:
    # Set explicitly (same as the default) to silence its startup warning in the log file.
    open-in-view: true
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    # Lets the db/seed SQL give its storage keys the same prefix real uploads get.
    placeholders:
      storagePrefix: ${app.storage.prefix}

app:
  # Filled in by Maven at build time; every backend log line carries it as backend_version.
  version: '@project.version@'
  # The admin dashboard (admin_dashboard/). Its secret must differ from app.jwt.secret and be at
  # least 32 bytes. allowed-origins: the dashboard's URL(s), comma-separated, for CORS.
  admin:
    jwt:
      secret: ${ADMIN_JWT_SECRET}
      access-token-ttl-minutes: 15
    # A login lasts this long, however active the admin is.
    session-ttl-hours: 12
    cookie-secure: true
    allowed-origins: ${ADMIN_ALLOWED_ORIGINS:}
    bootstrap:
      email: ${ADMIN_BOOTSTRAP_EMAIL:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  # Server health for the dashboard's Overview, fetched over the Coolify Docker network (container
  # name + port). kuma-status-page: the slug of a Kuma status page holding the monitors to show.
  # Blank: that part of the Overview shows as not set up.
  monitoring:
    kuma-url: ${KUMA_URL:}
    kuma-status-page: ${KUMA_STATUS_PAGE:}
    glances-url: ${GLANCES_URL:}
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 30
  storage:
    endpoint: ${STORAGE_ENDPOINT}
    bucket: ${STORAGE_BUCKET}
    access-key: ${STORAGE_ACCESS_KEY}
    secret-key: ${STORAGE_SECRET_KEY}
    prefix: ${STORAGE_PREFIX:}
    upload-url-ttl-minutes: 5
    read-url-ttl-minutes: 15
    max-upload-size-bytes: 5242880 # 5MB