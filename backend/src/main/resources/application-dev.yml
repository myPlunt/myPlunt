spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/myplunt_dev
    username: myplunt
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    locations: classpath:db/migration,classpath:db/seed

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-dev-only-secret-dev-only-secret}
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:4566}
    bucket: ${STORAGE_BUCKET:myplunt-dev}
    access-key: ${STORAGE_ACCESS_KEY:myplunt}
    secret-key: ${STORAGE_SECRET_KEY:myplunt-dev-secret}
    prefix: ${STORAGE_PREFIX:}