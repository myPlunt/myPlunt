# TEST STAGE
test-frontend:
  extends: [.node, .rules-frontend]
  stage: test
  script:
    - npm run test:ci

lint-frontend:
  extends: [.node, .rules-frontend]
  stage: test
  script:
    - npm run lint

typecheck-frontend:
  extends: [.node, .rules-frontend]
  stage: test
  script:
    - npx tsc --noEmit

test-backend:
  extends: .rules-backend
  stage: test
  image: eclipse-temurin:25-jdk
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: docker
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  cache:
    key:
      files:
        - backend/pom.xml
    paths:
      - .m2/repository/
  script:
    - cd backend
    - ./mvnw -B test

# BUILD STAGE
build-backend-staging:
  extends: [.docker-build, .rules-backend-dev]
  variables:
    BUILD_DIR: backend
    IMAGE_NAME: backend
    IMAGE_TAG: staging
  needs:
    - job: test-backend
      optional: true

build-backend-prod:
  extends: [.docker-build, .rules-backend-main]
  variables:
    BUILD_DIR: backend
    IMAGE_NAME: backend
    IMAGE_TAG: latest
  needs:
    - job: test-backend
      optional: true

build-landing:
  extends: [.docker-build, .rules-landing-main]
  variables:
    BUILD_DIR: web_landing
    IMAGE_NAME: web-landing
    IMAGE_TAG: latest
  needs: []

build-mobile-staging:
  extends: [.build-mobile, .rules-frontend-dev]
  variables:
    EAS_PROFILE: staging
    EXPO_PUBLIC_API_URL: $STAGING_API_URL
  needs:
    - job: test-frontend
      optional: true
    - job: lint-frontend
      optional: true
    - job: typecheck-frontend
      optional: true

build-mobile-prod:
  extends: [.build-mobile, .rules-frontend-main]
  variables:
    EAS_PROFILE: production
    EXPO_PUBLIC_API_URL: $PROD_API_URL
  needs:
    - job: test-frontend
      optional: true
    - job: lint-frontend
      optional: true
    - job: typecheck-frontend
      optional: true

# DEPLOY STAGE
deploy-backend-staging:
  extends: [.deploy-coolify, .rules-backend-dev]
  variables:
    WEBHOOK_URL: $COOLIFY_BACKEND_STAGING_WEBHOOK_URL
  environment:
    name: staging
  needs: ["build-backend-staging"]

deploy-backend-prod:
  extends: [.deploy-coolify, .rules-backend-main]
  variables:
    WEBHOOK_URL: $COOLIFY_BACKEND_PROD_WEBHOOK_URL
  environment:
    name: production
  needs: ["build-backend-prod"]

deploy-landing:
  extends: [.deploy-coolify, .rules-landing-main]
  variables:
    WEBHOOK_URL: $COOLIFY_LANDING_WEBHOOK_URL
  environment:
    name: production
  needs: ["build-landing"]

submit-mobile-staging:
  extends: [.submit-mobile, .rules-frontend-dev]
  variables:
    EAS_PROFILE: staging
  environment:
    name: staging
  needs: ["build-mobile-staging"]
  when: manual

submit-mobile-prod:
  extends: [.submit-mobile, .rules-frontend-main]
  variables:
    EAS_PROFILE: production
  environment:
    name: production
  needs: ["build-mobile-prod"]
  when: manual

