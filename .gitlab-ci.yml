stages:
  - test
  - build
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev")'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'

# Rule templates
.rules-frontend:
  rules:
    - changes:
        - "frontend/**/*"

.rules-backend:
  rules:
    - changes:
        - "backend/**/*"

.rules-frontend-dev:
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      changes:
        - "frontend/**/*"
      when: manual

.rules-frontend-main:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - "frontend/**/*"
      when: manual

.rules-backend-dev:
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      changes:
        - "backend/**/*"

.rules-backend-main:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - "backend/**/*"

.rules-landing-main:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - "web_landing/**/*"

.rules-admin:
  rules:
    - changes:
        - "admin_dashboard/**/*"

.rules-admin-dev:
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      changes:
        - "admin_dashboard/**/*"

.rules-admin-main:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - "admin_dashboard/**/*"

# Job templates
.node:
  image: node:22-alpine
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/
  before_script:
    - apk add --no-cache git
    - cd frontend
    - npm ci --cache .npm --prefer-offline

.docker-build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  # BUILD_ARGS is optional (e.g. the admin dashboard's API URL, baked in at build time).
  script:
    - docker build $BUILD_ARGS -t "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$IMAGE_TAG" "$BUILD_DIR/"
    - docker push "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$IMAGE_TAG"

.deploy-coolify:
  stage: deploy
  image: curlimages/curl
  script:
    - 'curl -fsS -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" "$WEBHOOK_URL"'

.build-mobile:
  extends: .node
  stage: build
  script:
    - npx --yes eas-cli@latest build --platform ios --profile "$EAS_PROFILE" --non-interactive

.submit-mobile:
  extends: .node
  stage: deploy
  script:
    - npx --yes eas-cli@latest submit --platform ios --profile "$EAS_PROFILE" --non-interactive --latest --no-wait

# TEST STAGE
test-frontend:
  extends: [.node, .rules-frontend]
  stage: test
  script:
    - npm run test:ci

lint-frontend:
  extends: [.node, .rules-frontend]
  stage: test
  script:
    - npm run lint

typecheck-frontend:
  extends: [.node, .rules-frontend]
  stage: test
  script:
    - npx tsc --noEmit

test-backend:
  extends: .rules-backend
  stage: test
  image: eclipse-temurin:25-jdk
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: docker
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  cache:
    key:
      files:
        - backend/pom.xml
    paths:
      - .m2/repository/
  script:
    - cd backend
    - ./mvnw -B test

check-admin:
  extends: .rules-admin
  stage: test
  image: node:22-alpine
  cache:
    key:
      files:
        - admin_dashboard/package-lock.json
    paths:
      - admin_dashboard/.npm/
  script:
    - cd admin_dashboard
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm run build

# BUILD STAGE
build-backend-staging:
  extends: [.docker-build, .rules-backend-dev]
  variables:
    BUILD_DIR: backend
    IMAGE_NAME: backend
    IMAGE_TAG: staging
  needs:
    - job: test-backend
      optional: true

build-backend-prod:
  extends: [.docker-build, .rules-backend-main]
  variables:
    BUILD_DIR: backend
    IMAGE_NAME: backend
    IMAGE_TAG: latest
  needs:
    - job: test-backend
      optional: true

build-landing:
  extends: [.docker-build, .rules-landing-main]
  variables:
    BUILD_DIR: web_landing
    IMAGE_NAME: web-landing
    IMAGE_TAG: latest
  needs: []

build-admin-staging:
  extends: [.docker-build, .rules-admin-dev]
  variables:
    BUILD_DIR: admin_dashboard
    IMAGE_NAME: admin-dashboard
    IMAGE_TAG: staging
    BUILD_ARGS: "--build-arg VITE_API_URL=$STAGING_BACKEND_URL --build-arg VITE_APP_VARIANT=staging"
  needs:
    - job: check-admin
      optional: true

build-admin-prod:
  extends: [.docker-build, .rules-admin-main]
  variables:
    BUILD_DIR: admin_dashboard
    IMAGE_NAME: admin-dashboard
    IMAGE_TAG: latest
    BUILD_ARGS: "--build-arg VITE_API_URL=$PROD_BACKEND_URL"
  needs:
    - job: check-admin
      optional: true

build-mobile-staging:
  extends: [.build-mobile, .rules-frontend-dev]
  variables:
    EAS_PROFILE: staging
  needs:
    - job: test-frontend
      optional: true
    - job: lint-frontend
      optional: true
    - job: typecheck-frontend
      optional: true

build-mobile-prod:
  extends: [.build-mobile, .rules-frontend-main]
  variables:
    EAS_PROFILE: production
  needs:
    - job: test-frontend
      optional: true
    - job: lint-frontend
      optional: true
    - job: typecheck-frontend
      optional: true

# DEPLOY STAGE
deploy-backend-staging:
  extends: [.deploy-coolify, .rules-backend-dev]
  variables:
    WEBHOOK_URL: $COOLIFY_BACKEND_STAGING_WEBHOOK_URL
  environment:
    name: staging
  needs: ["build-backend-staging"]

deploy-backend-prod:
  extends: [.deploy-coolify, .rules-backend-main]
  variables:
    WEBHOOK_URL: $COOLIFY_BACKEND_PROD_WEBHOOK_URL
  environment:
    name: production
  needs: ["build-backend-prod"]

reset-staging-db:
  stage: deploy
  image: curlimages/curl
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: manual
  variables:
    GIT_STRATEGY: none
  environment:
    name: staging
    action: access
  script:
    - 'curl -fsS -X POST -H "X-Ops-Secret: $OPS_RESET_SECRET" "$STAGING_BACKEND_URL/v1/ops/reset-db"'

deploy-landing:
  extends: [.deploy-coolify, .rules-landing-main]
  variables:
    WEBHOOK_URL: $COOLIFY_LANDING_WEBHOOK_URL
  environment:
    name: production
  needs: ["build-landing"]

deploy-admin-staging:
  extends: [.deploy-coolify, .rules-admin-dev]
  variables:
    WEBHOOK_URL: $COOLIFY_ADMIN_STAGING_WEBHOOK_URL
  environment:
    name: staging
  needs: ["build-admin-staging"]

deploy-admin-prod:
  extends: [.deploy-coolify, .rules-admin-main]
  variables:
    WEBHOOK_URL: $COOLIFY_ADMIN_PROD_WEBHOOK_URL
  environment:
    name: production
  needs: ["build-admin-prod"]

submit-mobile-staging:
  extends: [.submit-mobile, .rules-frontend-dev]
  variables:
    EAS_PROFILE: staging
  environment:
    name: staging
  needs: ["build-mobile-staging"]
  when: manual

submit-mobile-prod:
  extends: [.submit-mobile, .rules-frontend-main]
  variables:
    EAS_PROFILE: production
  environment:
    name: production
  needs: ["build-mobile-prod"]
  when: manual