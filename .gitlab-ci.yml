stages:
  - test
  - build
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev")'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'

# Rule templates
.rules-frontend:
  rules:
    - changes:
        - "frontend/**/*"

.rules-backend:
  rules:
    - changes:
        - "backend/**/*"

.rules-frontend-dev:
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      changes:
        - "frontend/**/*"

.rules-frontend-main:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - "frontend/**/*"

.rules-backend-dev:
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      changes:
        - "backend/**/*"

.rules-backend-main:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - "backend/**/*"

.rules-landing-main:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - "web_landing/**/*"

# Job templates
.node:
  image: node:22-alpine
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/
  before_script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline

.docker-build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$IMAGE_TAG" "$BUILD_DIR/"
    - docker push "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$IMAGE_TAG"

.deploy-coolify:
  stage: deploy
  image: curlimages/curl
  script:
    - 'curl -fsS -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" "$WEBHOOK_URL"'

.build-mobile:
  extends: .node
  stage: build
  script:
    - npx --yes eas-cli@latest build --platform ios --profile "$EAS_PROFILE" --non-interactive

.submit-mobile:
  extends: .node
  stage: deploy
  script:
    - npx --yes eas-cli@latest submit --platform ios --profile "$EAS_PROFILE" --non-interactive --latest

